name: VirgoYT fogos TWRP build

# Active workflow for the VirgoYT fogos recovery port.
# The kernel, vendor-ramdisk modules, fstab, and device inputs are sourced from
# the inspected Android 17 payload. The known-working TWRP 12.1 manifest is
# used for a repeatable build; this is not mislabeled as a TWRP 14/Android 17
# framework build.

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish a Release after a successful validated build
        required: true
        default: false
        type: boolean
      release_tag:
        description: Release tag used only when publishing manually
        required: false
        default: virgoyt-fogos-twrp-test
        type: string

concurrency:
  group: virgoyt-fogos-twrp-${{ github.ref }}
  cancel-in-progress: true

env:
  DEVICE_CODENAME: fogos
  BRAND: VirgoYT
  # Known-working manifest branch for this tree; device inputs target Android 17.
  TWRP_MANIFEST_BRANCH: twrp-12.1

jobs:
  build:
    name: Build fogos Android 17 recovery candidate
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    permissions:
      contents: read
    steps:
      - name: Check out VirgoYT device tree
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Install build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            adb autoconf automake bc bison build-essential ccache curl flex \
            g++-multilib gcc-multilib git git-lfs gnupg gperf imagemagick \
            lib32ncurses5-dev lib32readline-dev lib32z1-dev libelf-dev \
            liblz4-tool libncurses5-dev libncursesw5-dev libssl-dev \
            libxml2-utils lzop pngcrush rsync schedtool squashfs-tools \
            unzip xsltproc zip zlib1g-dev

      - name: Install repo launcher
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/bin"
          curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo -o "$HOME/bin/repo"
          chmod 0755 "$HOME/bin/repo"
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Configure Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '11'

      - name: Initialize TWRP source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$GITHUB_WORKSPACE/twrp-source"
          mkdir -p "$GITHUB_WORKSPACE/twrp-source"
          cd "$GITHUB_WORKSPACE/twrp-source"
          repo init --depth=1 \
            -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git \
            -b "$TWRP_MANIFEST_BRANCH"
          repo sync -c --no-clone-bundle --no-tags --optimized-fetch -j2

      - name: Add checked-in fogos device tree
        shell: bash
        run: |
          set -euo pipefail
          test -f "$GITHUB_WORKSPACE/device/motorola/fogos/BoardConfig.mk"
          test -f "$GITHUB_WORKSPACE/device/motorola/fogos/AndroidProducts.mk"
          mkdir -p "$GITHUB_WORKSPACE/twrp-source/device/motorola"
          rsync -a --delete \
            "$GITHUB_WORKSPACE/device/motorola/fogos/" \
            "$GITHUB_WORKSPACE/twrp-source/device/motorola/fogos/"

      - name: Build recovery boot image
        working-directory: twrp-source
        shell: bash
        run: |
          # TWRP/AOSP envsetup and mka intentionally read some unset helper
          # variables while rebuilding the variable cache, so strict -u is not
          # compatible with this manifest branch.
          set -eo pipefail
          test -f build/envsetup.sh
          source build/envsetup.sh
          # TWRP's custom lunch calls roomservice when the product is not
          # discoverable. Refuse that fallback and verify the checked-in tree
          # before any build can continue.
          expected_tree_sha="$(sha256sum "$GITHUB_WORKSPACE/device/motorola/fogos/BoardConfig.mk" | cut -d ' ' -f1)"
          lunch twrp_fogos-eng
          test "$(get_build_var TARGET_PRODUCT)" = twrp_fogos
          test "$(get_build_var TARGET_DEVICE)" = fogos
          test "$(sha256sum device/motorola/fogos/BoardConfig.mk | cut -d ' ' -f1)" = "$expected_tree_sha"
          test -f device/motorola/fogos/AndroidProducts.mk
          test -f device/motorola/fogos/BoardConfig.mk
          mka bootimage adbd -j"$(nproc)"

      - name: Validate image and write metadata
        working-directory: twrp-source
        shell: bash
        run: |
          set -euo pipefail
          image="out/target/product/fogos/boot.img"
          test -s "$image"
          python3 "$GITHUB_WORKSPACE/tools/validate_fogos_recovery.py" "$image"
          magic="$(dd if="$image" bs=1 count=8 2>/dev/null)"
          test "$magic" = 'ANDROID!'
          size="$(stat -c '%s' "$image")"
          test "$size" -eq 100663296
          sha256sum "$image" | tee "$GITHUB_WORKSPACE/fogos-twrp-boot.sha256"
          cp "$image" "$GITHUB_WORKSPACE/virgoyt-fogos-twrp-${GITHUB_SHA}.img"
          {
            printf 'brand=%s\n' "$BRAND"
            printf 'device=moto g45 5G (%s)\n' "$DEVICE_CODENAME"
            printf 'manifest_branch=%s\n' "$TWRP_MANIFEST_BRANCH"
            printf 'commit=%s\n' "$GITHUB_SHA"
            printf 'run=%s\n' "$GITHUB_RUN_ID"
            printf 'size=%s\n' "$size"
            printf 'sha256=%s\n' "$(cut -d ' ' -f1 "$GITHUB_WORKSPACE/fogos-twrp-boot.sha256")"
            printf 'temporary_boot_only=true\n'
            printf 'hardware_validation_required=true\n'
            printf 'android17_verified=false\n'
          } | tee "$GITHUB_WORKSPACE/fogos-twrp-build-info.txt"

      - name: Upload validated artifact
        uses: actions/upload-artifact@v4
        with:
          name: virgoyt-fogos-twrp-${{ github.sha }}
          if-no-files-found: error
          path: |
            virgoyt-fogos-twrp-${{ github.sha }}.img
            fogos-twrp-boot.sha256
            fogos-twrp-build-info.txt

  release:
    name: Publish manually requested release
    needs: build
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_release == true && needs.build.result == 'success' }}
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: Download validated artifact
        uses: actions/download-artifact@v4
        with:
          name: virgoyt-fogos-twrp-${{ github.sha }}
          path: release-assets

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$RELEASE_TAG"

          gh release create "$RELEASE_TAG" release-assets/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "$RELEASE_TAG" \
            --notes "VirgoYT Moto G45 5G (fogos) Android 17 recovery candidate. Static storage, encryption, touchscreen-module, USB mouse/OTG, ADB, sideload, boot-header, size, and checksum gates passed. Temporary-boot test required before any permanent flash; physical touchscreen, decryption, mouse, and sideload behavior are not certifiable in CI." \
            --target "$GITHUB_SHA"
