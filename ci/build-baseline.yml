name: Build fogos recovery baseline

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            adb autoconf automake bc bison build-essential ccache curl flex \
            g++-multilib gcc-multilib git git-lfs gnupg gperf imagemagick \
            lib32ncurses5-dev lib32readline-dev lib32z1-dev libelf-dev \
            liblz4-tool libncurses5-dev libncurses5 libncursesw5-dev \
            libsdl1.2-dev libssl-dev libxml2-utils lzop pngcrush rsync \
            schedtool squashfs-tools xsltproc zip zlib1g-dev

      - name: Install repo
        run: |
          mkdir -p "${HOME}/bin"
          curl -L https://storage.googleapis.com/git-repo-downloads/repo -o "${HOME}/bin/repo"
          chmod a+rx "${HOME}/bin/repo"
          echo "${HOME}/bin" >> "${GITHUB_PATH}"

      - name: Initialize TWRP source
        run: |
          mkdir twrp-source
          cd twrp-source
          repo init --depth=1 \
            -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git \
            -b twrp-12.1
          mkdir -p .repo/local_manifests
          cat > .repo/local_manifests/fogos.xml <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <manifest>
            <remote name="github" fetch="https://github.com/" />
            <project path="device/motorola/fogos"
                     name="darkvirgoyt-beep/moto-g45-fogos-android17-recovery"
                     remote="github"
                     revision="main" />
          </manifest>
          EOF
          repo sync -c --no-clone-bundle --no-tags -j2

      - name: Build baseline recovery
        working-directory: twrp-source
        run: |
          export ALLOW_MISSING_DEPENDENCIES=true
          source build/envsetup.sh
          lunch twrp_fogos-eng
          mka bootimage adbd -j"$(nproc)"

      - name: Upload build logs and metadata
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fogos-recovery-baseline-build
          path: |
            twrp-source/out/target/product/fogos/installed-files*.txt
            twrp-source/out/target/product/fogos/*.img
            twrp-source/out/target/product/fogos/obj/PACKAGING/target_files_intermediates/**/*.txt
          if-no-files-found: ignore
